<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
  <title>Spots data · Dotsie</title>
  <meta name="description" content="Search what Wikidata and the National Park Service say about places in the US, as collected for Dotsie's sights.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/design-system/tokens.css">
  <link rel="stylesheet" href="/design-system/components.css">
  <link rel="stylesheet" href="/developer/developer.css">
</head>
<body class="wt-base">
  <main class="dev">
    <header class="dev__head">
      <p class="dev__crumb">Data</p>
      <h1 class="dev__title">Spots data</h1>
      <p class="dev__lede" id="loaded">What Wikidata and the National Park Service say about places in the US, collected each month for Dotsie's sights. Nothing here is filtered or rated yet.</p>
    </header>

    <section id="list" class="dev__place">
      <label class="wt-input wt-input-group wt-search">
        <span id="search-icon"></span>
        <input id="q" type="search" placeholder="Search by name" aria-label="Search places by name" autocomplete="off">
        <span class="wt-spinner" id="spinner" hidden></span>
      </label>
      <div class="dev__filters">
        <select id="state" class="wt-input" aria-label="State"><option value="">All states</option></select>
        <select id="source" class="wt-input" aria-label="Source">
          <option value="">All sources</option>
          <option value="wikidata">Wikidata</option>
          <option value="nps">National Park Service</option>
        </select>
      </div>
      <div class="dev__results" id="results" aria-live="polite"></div>
      <button type="button" class="wt-btn wt-btn--secondary" id="more" hidden>Show more</button>
    </section>

    <section id="detail" class="dev__place" hidden></section>

    <p class="dev__foot">Sources: <a href="https://www.wikidata.org/">Wikidata</a> (CC0), the <a href="https://www.nps.gov/subjects/developer/">NPS Data API</a> (public domain) and English Wikipedia page views from <a href="https://dumps.wikimedia.org/other/pageview_complete/">Wikimedia</a>.</p>
  </main>
  <script src="/design-system/icons.js"></script>
  <script src="/developer/shell.js"></script>
  <script src="/developer/spots.js"></script>
</body>
</html>
