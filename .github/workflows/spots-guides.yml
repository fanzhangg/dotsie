# Destinations' picks and their guidebook entries, written by a model from their states' stores (issue #90): cities,
# counties and national parks in pipeline/destinations.json (pipeline/destinations.py adds parks and counties).
# Run by hand. It reads the stores the Spots data workflow keeps in R2, asks Claude (pipeline/guides.py), saves the
# answers back into each destination's state's store, and loads the guides into D1, where the app's Spots page shows
# them. A model answer whose input hasn't changed is reused, so running a destination again costs little.
name: Spots guides

on:
  workflow_dispatch:
    inputs:
      destinations:
        description: 'Ids from pipeline/destinations.json, or "parks", "counties", "cities", state codes ("WA"), "all"; comma-separated'
        default: seattle

# The same group as Spots data: both update the stores in R2.
concurrency:
  group: spots-data
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  R2: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  BUCKET: ${{ vars.SPOTS_BUCKET || 'waythread-spots' }}

defaults:
  run:
    working-directory: pipeline

jobs:
  # One job per state: a state's destinations write the same store, so they run one after another in it
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      states: ${{ steps.plan.outputs.states }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          WANT: ${{ inputs.destinations }}
        run: |
          jobs=$(python3 destinations.py plan "$WANT")
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "states=$(echo "$jobs" | python3 -c 'import json,sys; print(json.dumps([j["state"] for j in json.load(sys.stdin)]))')" >> "$GITHUB_OUTPUT"
          python3 destinations.py plan "$WANT" --markdown >> "$GITHUB_STEP_SUMMARY"

  guides:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4 # kind to the Anthropic API's rate limits, Wikimedia Commons and the boundary services
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    env:
      ST: ${{ matrix.job.state }}
      IDS: ${{ join(matrix.job.ids, ' ') }}
      STORES: ${{ join(matrix.job.stores, ' ') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic==2.6.0
      # The state's own store holds the guides; the others (a park across a state line) are only read
      - name: The stores
        run: |
          mkdir -p data
          for s in $STORES; do
            if aws s3 cp --endpoint-url "$R2" "s3://$BUCKET/stores/$s.sqlite.gz" "data/$s.sqlite.gz"; then
              gunzip "data/$s.sqlite.gz"
            elif [ "$s" = "$ST" ]; then
              echo "No store for $ST: run Spots data for it first"; exit 1
            else
              echo "No store for $s: the destinations that reach into it go without its places"
            fi
          done
      # Stopped before the job's time limit, so the answers so far are saved below: running it again carries on
      - name: Pick and write
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          status=0
          timeout --signal=INT --kill-after=5m 300m python3 guides.py --destination $IDS || status=$?
          for id in $IDS; do
            if [ -f "data/$id-guides.json" ]; then
              { echo "### $id"; echo '```json'; cat "data/$id-guides.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### $id: failed (see the log)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit $status
      # Saved even when a step above failed partway: the answers it got cost money to ask again
      - name: Save the store to R2
        if: ${{ always() && hashFiles(format('pipeline/data/{0}.sqlite', matrix.job.state)) != '' }}
        run: |
          gzip -kf "data/$ST.sqlite"
          aws s3 cp --endpoint-url "$R2" "data/$ST.sqlite.gz" "s3://$BUCKET/stores/$ST.sqlite.gz"
      # Every guide the state's store has, the ones just made and those from before; loaded by the load job below
      - name: The state's guides as SQL for D1
        if: ${{ always() && hashFiles(format('pipeline/data/{0}.sqlite', matrix.job.state)) != '' }}
        run: |
          set -o pipefail
          python3 export_d1.py --state "$ST" --guides | gzip > "data/$ST.guides.sql.gz"
          aws s3 cp --endpoint-url "$R2" "data/$ST.guides.sql.gz" "s3://$BUCKET/d1/$ST.guides.sql.gz"

  load:
    needs: [plan, guides]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Load each state's guides into D1
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STATES: ${{ needs.plan.outputs.states }}
        run: ../pipeline/load_d1.sh guides.sql.gz $(echo "$STATES" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))')
